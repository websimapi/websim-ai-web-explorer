<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Explorer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100%;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        
        .main-content {
            display: flex;
            flex: 1;
            height: calc(100vh - 4rem);
        }
        
        .iframe-container {
            flex: 2;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
            height: 100%;
        }
        
        #explorer-frame {
            flex: 1;
            border: none;
            width: 100%;
            height: calc(100% - 3rem);
            background: white;
        }
        
        .controls {
            display: flex;
            padding: 0.5rem;
            background-color: #f1f1f1;
            height: 2rem;
        }
        
        .controls button {
            margin-right: 0.5rem;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            border: 1px solid #ccc;
            background: white;
        }
        
        #url-input {
            flex: 1;
            padding: 0.25rem 0.5rem;
            margin-right: 0.5rem;
            border: 1px solid #ccc;
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #f9f9f9;
            height: 100%;
        }
        
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background-color: white;
        }
        
        .input-area {
            display: flex;
            padding: 0.5rem;
            background-color: #f1f1f1;
        }
        
        #user-input {
            flex: 1;
            padding: 0.5rem;
            resize: none;
            min-height: 50px;
            border: 1px solid #ccc;
        }
        
        #send-btn {
            margin-left: 0.5rem;
            padding: 0.5rem 1rem;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        .message {
            margin-bottom: 1rem;
            padding: 0.8rem;
            border-radius: 5px;
            max-width: 90%;
        }
        
        .user-message {
            background-color: #e8f4f8;
            margin-left: auto;
            text-align: right;
        }
        
        .ai-message {
            background-color: #f0f0f0;
            margin-right: auto;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 10px;
        }
        
        .status-active {
            background-color: #2ecc71;
        }
        
        .status-thinking {
            background-color: #f39c12;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Web Explorer <span class="status-indicator status-active" id="status-light"></span></h1>
            <div>
                <button id="clear-btn">Clear Chat</button>
            </div>
        </header>
        
        <div class="main-content">
            <div class="iframe-container">
                <div class="controls">
                    <button id="back-btn">⬅️</button>
                    <button id="forward-btn">➡️</button>
                    <button id="refresh-btn">🔄</button>
                    <input type="text" id="url-input" placeholder="Enter URL">
                    <button id="go-btn">Go</button>
                </div>
                <iframe id="explorer-frame" src="about:blank" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
            </div>
            
            <div class="chat-container">
                <div id="chat-messages"></div>
                <div class="input-area">
                    <textarea id="user-input" placeholder="Tell the AI what to do..."></textarea>
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Store conversation history
        let conversationHistory = [];
        
        // DOM elements
        const explorerFrame = document.getElementById('explorer-frame');
        const urlInput = document.getElementById('url-input');
        const goBtn = document.getElementById('go-btn');
        const backBtn = document.getElementById('back-btn');
        const forwardBtn = document.getElementById('forward-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const clearBtn = document.getElementById('clear-btn');
        const statusLight = document.getElementById('status-light');
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Add a welcome message
            addMessage('AI', 'Hello! I can help you browse the web. Just tell me what you want to search for or enter a URL to visit. I can help you navigate pages, extract information, and perform tasks for you.');
        });
        
        // Event listeners
        goBtn.addEventListener('click', () => {
            navigateTo(urlInput.value);
        });
        
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                navigateTo(urlInput.value);
            }
        });
        
        backBtn.addEventListener('click', () => {
            try {
                explorerFrame.contentWindow.history.back();
            } catch (e) {
                addMessage('AI', 'Unable to go back due to security restrictions.');
            }
        });
        
        forwardBtn.addEventListener('click', () => {
            try {
                explorerFrame.contentWindow.history.forward();
            } catch (e) {
                addMessage('AI', 'Unable to go forward due to security restrictions.');
            }
        });
        
        refreshBtn.addEventListener('click', () => {
            try {
                explorerFrame.src = explorerFrame.src;
            } catch (e) {
                addMessage('AI', 'Unable to refresh due to security restrictions.');
            }
        });
        
        sendBtn.addEventListener('click', handleUserInput);
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleUserInput();
            }
        });
        
        clearBtn.addEventListener('click', () => {
            chatMessages.innerHTML = '';
            conversationHistory = [];
            addMessage('AI', 'Chat cleared. What would you like me to help you with?');
        });
        
        // Check if the page loaded successfully
        explorerFrame.addEventListener('load', () => {
            try {
                urlInput.value = explorerFrame.contentWindow.location.href;
                // Try to access the iframe content
                const title = explorerFrame.contentDocument.title;
                addMessage('AI', `Page loaded: "${title}". What would you like me to do with this page?`);
            } catch (error) {
                // If we can't access the content, it's likely a CORS issue
                addMessage('AI', `Page loaded, but I cannot access its content due to security restrictions. I can still help navigate by URL or perform general web searches.`);
            }
        });
        
        // Functions
        function navigateTo(url) {
            if (!url) return;
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                // Check if it's a domain or a search query
                if (url.includes('.') && !url.includes(' ')) {
                    url = 'https://' + url;
                } else {
                    // It's a search query
                    url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
                }
            }
            
            try {
                explorerFrame.src = url;
                urlInput.value = url;
                addMessage('AI', `Navigating to ${url}`);
            } catch (error) {
                addMessage('AI', `Sorry, I couldn't navigate to ${url}. Error: ${error.message}`);
            }
        }
        
        function addMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(sender.toLowerCase() + '-message');
            
            const senderSpan = document.createElement('strong');
            senderSpan.textContent = sender + ': ';
            
            const textSpan = document.createElement('span');
            textSpan.textContent = text;
            
            messageDiv.appendChild(senderSpan);
            messageDiv.appendChild(textSpan);
            chatMessages.appendChild(messageDiv);
            
            // Auto scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            // Add to conversation history
            if (sender.toLowerCase() !== 'status') {
                conversationHistory.push({
                    role: sender.toLowerCase() === 'user' ? 'user' : 'assistant',
                    content: text
                });
                
                // Keep conversation history manageable
                if (conversationHistory.length > 20) {
                    conversationHistory = conversationHistory.slice(-20);
                }
            }
        }
        
        async function handleUserInput() {
            const userPrompt = userInput.value.trim();
            if (!userPrompt) return;
            
            // Add user message
            addMessage('User', userPrompt);
            userInput.value = '';
            
            // Show thinking indicator
            statusLight.classList.remove('status-active');
            statusLight.classList.add('status-thinking');
            
            try {
                // Get current page URL
                const currentUrl = explorerFrame.src;
                
                // Get information about the page content
                let pageContent = "Unable to access page content due to security restrictions";
                let pageTitle = "Unknown page";
                
                try {
                    // This may not work for cross-origin requests due to browser security
                    pageTitle = explorerFrame.contentDocument.title;
                    const bodyText = explorerFrame.contentDocument.body.innerText;
                    pageContent = bodyText.substring(0, 3000) + (bodyText.length > 3000 ? "..." : "");
                } catch (error) {
                    console.error("Could not get page content:", error);
                }
                
                // Process the user request with LLM
                const aiResponse = await processWithAI(userPrompt, currentUrl, pageTitle, pageContent);
                
                // Handle AI response
                addMessage('AI', aiResponse.message);
                
                // Execute actions if any
                if (aiResponse.action) {
                    await executeAction(aiResponse.action);
                }
            } catch (error) {
                addMessage('AI', `Sorry, I encountered an error: ${error.message}`);
            } finally {
                // Reset status indicator
                statusLight.classList.remove('status-thinking');
                statusLight.classList.add('status-active');
            }
        }
        
        async function processWithAI(userPrompt, currentUrl, pageTitle, pageContent) {
            // Create a message for the AI that includes context
            const systemPrompt = `
            You are an advanced web browsing assistant that helps users navigate and interact with websites.
            
            Current Context:
            - Current URL: ${currentUrl}
            - Page title: ${pageTitle}
            - Page content snippet: ${pageContent.substring(0, 1000)}${pageContent.length > 1000 ? "..." : ""}
            
            You can perform the following actions:
            1. Navigate to websites 
            2. Search for information
            3. Analyze page content (when accessible)
            4. Provide step-by-step guidance for complex tasks
            
            If the user wants you to visit a website or search for something, you should include an action in your response.
            
            Actions must be formatted as: [ACTION:{"type":"action_type", ...parameters}]
            
            Available action types:
            - "navigate": Go to a specific URL. Parameters: {"url": "https://example.com"}
            - "search": Search for information. Parameters: {"query": "search terms"}
            
            Example actions:
            [ACTION:{"type":"navigate","url":"https://www.wikipedia.org"}]
            [ACTION:{"type":"search","query":"latest tech news"}]
            
            Be helpful, clear, and concise in your responses. If you can't perform a requested action due to browser limitations, explain why and suggest alternatives.
            `;
            
            // Use the LLM API to process the prompt
            const completion = await websim.chat.completions.create({
                messages: [
                    {
                        role: "system",
                        content: systemPrompt
                    },
                    ...conversationHistory.slice(-8), // Include recent conversation
                    {
                        role: "user",
                        content: userPrompt
                    }
                ]
            });
            
            const aiResponse = completion.content;
            
            // Parse any action from the response
            let action = null;
            const actionMatch = aiResponse.match(/\[ACTION:(\{.*?\})\]/);
            if (actionMatch && actionMatch[1]) {
                try {
                    action = JSON.parse(actionMatch[1]);
                    // Remove the action part from the displayed message
                    const cleanMessage = aiResponse.replace(/\[ACTION:(\{.*?\})\]/, '').trim();
                    return { message: cleanMessage, action };
                } catch (error) {
                    console.error("Failed to parse action:", error);
                }
            }
            
            return { message: aiResponse, action: null };
        }
        
        async function executeAction(action) {
            switch (action.type) {
                case 'navigate':
                    if (action.url) {
                        navigateTo(action.url);
                    }
                    break;
                    
                case 'search':
                    if (action.query) {
                        navigateTo(`https://www.google.com/search?q=${encodeURIComponent(action.query)}`);
                    }
                    break;
                
                default:
                    addMessage('AI', `Unknown action type: ${action.type}`);
            }
        }
    </script>

</body>
</html>
